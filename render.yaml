services:
  - type: web
    name: ashare-risk-web
    runtime: python
    plan: free
    buildCommand: python restore_payload.py && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.fileWatcherType none --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: ASHARE_RISK_USE_MOCK
        value: "0"
      - key: ASHARE_RISK_MOCK_ON_FAILURE
        value: "0"
      - key: ASHARE_RISK_FAST_START
        value: "1"
      - key: ASHARE_RISK_CLOUD_FAST_MODE
        value: "0"
      - key: ASHARE_REALTIME_REFRESH_SECONDS
        value: "1"
      - key: ASHARE_MARKET_SNAPSHOT_MAX_AGE_SECONDS
        value: "1800"
      - key: PYTHON_VERSION
        value: "3.12.8"
