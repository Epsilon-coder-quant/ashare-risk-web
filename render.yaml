services:
  - type: web
    name: ashare-risk-web
    runtime: python
    plan: free
    buildCommand: python restore_payload.py && pip install -r requirements.txt
    startCommand: sh -c 'python render_background_updater.py --interval ${ASHARE_FULL_MARKET_REFRESH_SECONDS:-60} --initial-delay 90 & streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.fileWatcherType none --browser.gatherUsageStats false --server.enableCORS false --server.enableXsrfProtection false'
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: ASHARE_RISK_USE_MOCK
        value: "0"
      - key: ASHARE_RISK_MOCK_ON_FAILURE
        value: "0"
      - key: ASHARE_RISK_FAST_START
        value: "1"
      - key: ASHARE_RISK_CLOUD_FAST_MODE
        value: "1"
      - key: ASHARE_REALTIME_REFRESH_SECONDS
        value: "15"
      - key: ASHARE_FULL_MARKET_REFRESH_SECONDS
        value: "60"
      - key: ASHARE_TENCENT_WORKERS
        value: "3"
      - key: ASHARE_TENCENT_BATCH_SIZE
        value: "260"
      - key: ASHARE_TENCENT_CHECKPOINT_ROWS
        value: "500"
      - key: ASHARE_TENCENT_PROGRESSIVE_MAX_SECONDS
        value: "85"
      - key: ASHARE_TENCENT_MIN_REAL_ROWS
        value: "1500"
      - key: ASHARE_EFFECTIVE_COVERAGE_TARGET
        value: "5000"
      - key: ASHARE_MARKET_SNAPSHOT_MAX_AGE_SECONDS
        value: "1800"
      - key: ASHARE_MEMORY_CLEANUP_INTERVAL_SECONDS
        value: "90"
      - key: ASHARE_CACHE_MAX_FILES
        value: "60"
      - key: ASHARE_CACHE_MAX_BYTES
        value: "134217728"
      - key: PYTHON_VERSION
        value: "3.12.8"
